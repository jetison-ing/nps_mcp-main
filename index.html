<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#20492f">
	<title>dont touch this</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f2e7;
			--leaf: #c4db76;
			--ink: #183321;
		}

		* { box-sizing: border-box; }

		html, body { width: 100%; min-height: 100%; margin: 0; }

		body {
			min-height: 100vh;
			overflow: hidden;
			isolation: isolate;
			color: var(--paper);
			background: #20492f;
			animation: green-shift 2.4s steps(1, end) infinite;
		}

		body::before, body::after {
			position: fixed;
			inset: 0;
			z-index: -1;
			content: "";
			pointer-events: none;
		}

		body::before {
			background-image: radial-gradient(rgba(244, 242, 231, .2) .7px, transparent .7px);
			background-size: 5px 5px;
			opacity: .2;
			mix-blend-mode: soft-light;
		}

		body::after {
			background: linear-gradient(125deg, transparent 35%, rgba(209, 224, 137, .12) 56%, transparent 72%);
			background-size: 180% 180%;
			animation: light-drift 22s linear infinite alternate;
		}

		@keyframes green-shift {
			0%, 24% { background-color: #183f2d; }
			25%, 49% { background-color: #376b3c; }
			50%, 74% { background-color: #54794a; }
			75%, 100% { background-color: #28573a; }
		}

		@keyframes light-drift {
			from { background-position: 0% 30%; }
			to { background-position: 100% 70%; }
		}

		.touch-button {
			position: fixed;
			z-index: 3;
			top: 0;
			left: 0;
			width: 226px;
			min-height: 66px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 0 19px;
			border: 1px solid var(--paper);
			border-radius: 2px;
			color: var(--ink);
			background: var(--leaf);
			box-shadow: 5px 5px 0 rgba(16, 42, 26, .3);
			cursor: pointer;
			font: 500 12px monospace;
			transition: background .2s ease, box-shadow .2s ease, scale .2s ease;
		}

		.touch-button:hover { background: #d9e89f; box-shadow: 7px 7px 0 rgba(16, 42, 26, .25); scale: 1.03; }
		.touch-button:focus-visible { outline: 3px solid var(--paper); outline-offset: 5px; }
		.touch-button:disabled { cursor: wait; }

		.fact-box {
			position: fixed;
			z-index: 4;
			left: 0;
			top: 0;
			width: min(370px, calc(100vw - 28px));
			overflow: hidden;
			border: 1px solid rgba(24, 51, 33, .45);
			border-radius: 3px;
			color: var(--ink);
			background: var(--paper);
			box-shadow: 9px 11px 0 rgba(13, 34, 22, .28);
			visibility: hidden;
			opacity: 0;
			transform: scale(.94);
			transition: opacity .22s ease, transform .22s ease, visibility .22s;
			will-change: left, top;
		}

		.fact-box.is-visible { visibility: visible; opacity: 1; transform: scale(1); }

		.park-image {
			display: block;
			width: 100%;
			height: 132px;
			object-fit: cover;
			background: #8da772;
		}

		.fact-content { padding: 17px 19px 19px; }

		.fact-title {
			margin: 0 0 9px;
			font: 600 24px/1.05 Georgia, serif;
			letter-spacing: 0;
		}

		.fact-text { margin: 0; font-size: 13px; line-height: 1.55; }

		@media (max-width: 600px) {
			.touch-button { width: 205px; min-height: 58px; padding: 0 14px; font-size: 11px; }
			.park-image { height: 112px; }
			.fact-content { padding: 14px 16px 16px; }
			.fact-title { font-size: 21px; }
			.fact-text { font-size: 12px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body>
	<button class="touch-button" id="fact-button" type="button">
		dont touch this
	</button>

	<aside class="fact-box" id="fact-box" aria-live="polite" aria-atomic="true">
		<img class="park-image" id="park-image" alt="" hidden>
		<div class="fact-content">
			<div class="fact-label" id="fact-label"></div>
			<h2 class="fact-title" id="fact-title"></h2>
			<p class="fact-text" id="fact-text"></p>
			<div class="fact-footer"><span id="fact-location"></span></div>
		</div>
	</aside>

	<script>
		const button = document.querySelector("#fact-button");
		const box = document.querySelector("#fact-box");
		const image = document.querySelector("#park-image");
		const title = document.querySelector("#fact-title");
		const text = document.querySelector("#fact-text");
		const label = document.querySelector("#fact-label");
		const location = document.querySelector("#fact-location");
		const buttons = [button];
		const buttonMotion = [];

		for (let index = 0; index < 9; index += 1) {
			const duplicate = button.cloneNode(true);
			duplicate.removeAttribute("id");
			document.body.append(duplicate);
			buttons.push(duplicate);
		}

		for (const movingButton of buttons) {
			buttonMotion.push({
				button: movingButton,
				x: Math.random() * Math.max(0, window.innerWidth - movingButton.offsetWidth),
				y: Math.random() * Math.max(0, window.innerHeight - movingButton.offsetHeight),
				dx: (260 + Math.random() * 300) * (Math.random() < .5 ? -1 : 1),
				dy: (260 + Math.random() * 300) * (Math.random() < .5 ? -1 : 1),
				angle: 0
			});
		}

		let previousButtonFrame = 0;

		function moveButtons(timestamp) {
			const elapsed = Math.min(timestamp - (previousButtonFrame || timestamp), 40) / 1000;
			previousButtonFrame = timestamp;

			for (const motion of buttonMotion) {
				const maxX = Math.max(0, window.innerWidth - motion.button.offsetWidth);
				const maxY = Math.max(0, window.innerHeight - motion.button.offsetHeight);
				motion.x += motion.dx * elapsed;
				motion.y += motion.dy * elapsed;

				if (motion.x <= 0 || motion.x >= maxX) {
					motion.dx *= -1;
					motion.angle = Math.random() * 12 - 6;
				}
				if (motion.y <= 0 || motion.y >= maxY) {
					motion.dy *= -1;
					motion.angle = Math.random() * 12 - 6;
				}

				motion.x = Math.max(0, Math.min(maxX, motion.x));
				motion.y = Math.max(0, Math.min(maxY, motion.y));
				motion.button.style.left = `${motion.x}px`;
				motion.button.style.top = `${motion.y}px`;
				motion.button.style.rotate = `${motion.angle}deg`;
			}

			requestAnimationFrame(moveButtons);
		}

		requestAnimationFrame(moveButtons);

		let x = 40;
		let y = 100;
		let dx = 1.1;
		let dy = .78;
		let previousFrame = 0;

		function bounce(timestamp) {
			if (!box.classList.contains("is-visible")) {
				requestAnimationFrame(bounce);
				return;
			}

			const elapsed = Math.min(timestamp - (previousFrame || timestamp), 40);
			previousFrame = timestamp;
			const maxX = Math.max(14, window.innerWidth - box.offsetWidth - 14);
			const maxY = Math.max(14, window.innerHeight - box.offsetHeight - 14);
			x += dx * elapsed;
			y += dy * elapsed;

			if (x <= 14 || x >= maxX) dx *= -1;
			if (y <= 14 || y >= maxY) dy *= -1;
			x = Math.min(maxX, Math.max(14, x));
			y = Math.min(maxY, Math.max(14, y));
			box.style.left = `${x}px`;
			box.style.top = `${y}px`;
			requestAnimationFrame(bounce);
		}

		requestAnimationFrame(bounce);

		window.addEventListener("resize", () => {
			x = Math.min(x, window.innerWidth - box.offsetWidth - 14);
			y = Math.min(y, window.innerHeight - box.offsetHeight - 14);
		});

		for (const movingButton of buttons) movingButton.addEventListener("click", async () => {
			buttons.forEach((item) => { item.disabled = true; });
			label.textContent = "";
			title.textContent = "";
			text.textContent = "";
			location.textContent = "";
			image.hidden = true;
			box.classList.add("is-visible");
			x = Math.max(14, (window.innerWidth - box.offsetWidth) / 2);
			y = Math.max(14, (window.innerHeight - box.offsetHeight) / 2);
			box.style.left = `${x}px`;
			box.style.top = `${y}px`;

			try {
				const response = await fetch("/api/random-park", { cache: "no-store" });
				const park = await response.json();
				if (!response.ok) throw new Error(park.error || "The park radio is quiet. Try again.");

				label.textContent = park.designation || "A National Park Service site";
				title.textContent = park.fullName || park.name || "A national park";
				text.textContent = park.description || "This park is keeping its best stories for the trail.";
				location.textContent = [park.states, park.parkCode?.toUpperCase()].filter(Boolean).join(" · ") || "National Park Service";

				const photo = park.images?.[0];
				if (photo?.url) {
					image.src = photo.url;
					image.alt = photo.altText || `Landscape at ${park.fullName || "this park"}`;
					image.hidden = false;
				}
			} catch (error) {
				console.error("Could not load a random park:", error);
				title.textContent = "dont touch this";
			} finally {
				buttons.forEach((item) => { item.disabled = false; });
			}
		});
	</script>
</body>
</html>
